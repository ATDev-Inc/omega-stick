name: Build

on: [pull_request]

# This is the merge gate, so it must behave identically for pull requests from
# forks. Those always receive a read-only GITHUB_TOKEN regardless of what is
# requested here, so this job deliberately needs nothing but read access.
# Anything that writes back to the PR belongs in size_delta.yml instead.
permissions:
  contents: read

env:
  IDF_TARGET: 'esp32s3'
  IDF_VERSION: 'v6.0'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No submodules in this repository.
      with:
        persist-credentials: false # nothing here pushes; keep the token out of .git

    - name: Build main
      uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}

    # Updates over USB are off in the default build (D25), so this second build
    # keeps that code compiling. It uses its own build directory and sdkconfig
    # so the two configurations never share cached settings.
    - name: Build main with firmware updates over USB
      uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}
        command: 'idf.py -B build-ota -DSDKCONFIG=build-ota/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ota" build'
