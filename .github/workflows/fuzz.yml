name: Fuzz

on:
  pull_request:
  # Also on the default branch, so the README badge reflects it.
  push:
    branches: [main]
  # Nightly, off-peak: a longer run that keeps the evolved corpus between runs.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to fuzz (values above 60 are capped at 60)"
        type: number
        default: 10

permissions:
  contents: read

jobs:
  frame-fuzz:
    runs-on: ubuntu-latest
    # Up to 60 minutes of fuzzing plus the build and cache steps.
    timeout-minutes: 90
    # Runs that save the corpus cache (everything but pull requests) take turns
    # per ref, so a later save cannot silently replace an earlier run's inputs.
    # Pull requests do not save, so each gets its own group and runs freely.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('frame-fuzz-pr-{0}', github.run_id) || format('frame-fuzz-corpus-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the fuzz budget
        id: budget
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MINUTES: ${{ inputs.minutes }}
        run: |
          # 60 s for pull requests and pushes, 10 min nightly, and for a manual
          # run the minutes input, capped at 60.
          seconds=60
          case "$EVENT_NAME" in
            schedule) seconds=600 ;;
            workflow_dispatch)
              minutes="${INPUT_MINUTES%%.*}"
              case "$minutes" in
                ''|*[!0-9]*) minutes=10 ;;
              esac
              # More than two digits is over the cap; checked by length so a
              # huge value cannot overflow the numeric test.
              if [ "${#minutes}" -gt 2 ]; then minutes=60; fi
              if [ "$minutes" -lt 1 ]; then minutes=1; fi
              if [ "$minutes" -gt 60 ]; then minutes=60; fi
              seconds=$((minutes * 60))
              ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Fuzzing for $seconds seconds"

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev ninja-build

      - name: Configure
        run: |
          cmake -S tests/host -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DOMEGA_HOST_SANITIZE=ON -DOMEGA_HOST_FUZZ=ON

      - name: Build
        run: cmake --build build-host --target omega_frame_fuzz

      # The evolved inputs from earlier runs. libFuzzer writes new inputs to
      # the first directory only, so the committed seeds stay untouched.
      - name: Restore the evolved corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: frame-fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frame-fuzz-corpus-

      - name: Fuzz
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          FUZZ_SECONDS: ${{ steps.budget.outputs.seconds }}
        run: |
          mkdir -p fuzz-corpus
          build-host/omega_frame_fuzz fuzz-corpus tests/fuzz/corpus \
            -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048

      # Keeps the cache small: -merge=1 into a fresh directory keeps only the
      # inputs that add coverage. The committed seeds are listed first as a
      # merge input only (never as the destination, so they are not modified);
      # libFuzzer then keeps whichever file covers each feature, which may be a
      # seed-sized input, so the result is the smallest set covering both. Skips
      # cleanly when the fuzzer or the corpus is missing or the merge fails
      # (the unmerged corpus is kept), so a fuzz crash still reaches the
      # artifact upload and the report.
      - name: Minimize the evolved corpus
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          if [ ! -x build-host/omega_frame_fuzz ] || [ ! -d fuzz-corpus ]; then
            echo "Nothing to minimize"
            exit 0
          fi
          rm -rf fuzz-corpus-merged
          mkdir fuzz-corpus-merged
          if build-host/omega_frame_fuzz -merge=1 fuzz-corpus-merged tests/fuzz/corpus fuzz-corpus \
              -timeout=10 -rss_limit_mb=2048 && [ -n "$(ls -A fuzz-corpus-merged)" ]; then
            rm -rf fuzz-corpus
            mv fuzz-corpus-merged fuzz-corpus
          else
            echo "Merge failed or was empty, keeping the unminimized corpus"
          fi
          ls fuzz-corpus | wc -l
          # An input that only crashes during the merge would otherwise pass:
          # fail the job so the upload and the report pick the file up.
          shopt -s nullglob
          found=(crash-* leak-* timeout-* oom-*)
          if [ "${#found[@]}" -gt 0 ]; then
            echo "::error::Crash, leak, timeout or oom file present after the merge: ${found[*]}"
            exit 1
          fi

      # Not from pull requests: their caches are scoped to the PR and would
      # only add churn. Pull requests still restore the default branch's.
      - name: Save the evolved corpus
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: frame-fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per attempt, so the report never reads an earlier attempt's files.
          name: fuzz-crashes-${{ github.run_attempt }}
          path: |
            crash-*
            timeout-*
            oom-*
            leak-*
          if-no-files-found: ignore

  # Opens or updates an issue when a scheduled run, or a manual run on the
  # default branch, fails. Never runs for pull requests, pushes or manual runs
  # on other branches. Scheduled runs always use the default branch, and their
  # event payload may lack the repository, so the branch is checked only for
  # manual runs.
  report:
    needs: frame-fuzz
    if: >-
      ${{ always()
      && needs.frame-fuzz.result == 'failure'
      && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -u
          mkdir -p crashes
          # The artifact is absent when the job failed before any crash file
          # (gh then errors too), so a failure here is recorded, not fatal.
          download_note="The crash artifact could not be found or downloaded."
          if gh run download "$RUN_ID" --name "fuzz-crashes-$RUN_ATTEMPT" --dir crashes; then
            download_note="The crash artifact was downloaded but holds no crash, timeout, oom or leak file."
          fi
          file=$(find crashes -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) | sort | head -n 1)

          if [ -n "$file" ]; then
            title="Fuzz crash: frame-fuzz"
            name=$(basename "$file")
            size=$(wc -c < "$file")
            {
              echo "The frame fuzzer failed on a scheduled or manual run."
              echo
              echo "Run: $RUN_URL"
              echo "File: $name ($size bytes)"
              echo
              if [ "$size" -le 4096 ]; then
                echo "Input, base64:"
                echo
                echo '```'
                base64 -w0 "$file"
                echo
                echo '```'
                echo
                echo "Replay it with: base64 -d > $name, then build-host/omega_frame_fuzz $name"
              else
                echo "The input is larger than 4 KB: download it from the fuzz-crashes-$RUN_ATTEMPT artifact of the run."
              fi
            } > body.md
          else
            title="Fuzz target broken: frame-fuzz"
            {
              echo "The fuzz job failed without leaving a crash, timeout, oom or leak file (for example a build or setup failure)."
              echo
              echo "$download_note"
              echo
              echo "Run: $RUN_URL"
            } > body.md
          fi

          label_args=()
          if [ "$(gh label list --limit 200 --json name --jq 'map(select(.name == "fuzz")) | length')" -gt 0 ]; then
            label_args=(--label fuzz)
          fi

          # Search server-side so an older issue is found past the first page,
          # then keep the exact title match.
          existing=$(gh issue list --state open --search "\"$title\" in:title" --limit 20 \
            --json number,title | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md "${label_args[@]}"
          fi
