name: Host tests

on: [pull_request]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S tests/host -B build-host -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure
