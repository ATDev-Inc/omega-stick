name: Security

# Secret scan of the whole history plus a lint of the workflows themselves.
# Both fail the job on a finding, so a committed key or a workflow that
# runs untrusted input is caught before merge. Tools are the plain
# binaries, not their marketplace actions: gitleaks-action needs a licence
# for organisation repositories, the binary does not.

on:
  push:
    branches: [main, marshall-updates]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily, catches rules added after a commit landed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # sha256sum -c finds the file by the name in checksums.txt, so the
          # download must keep that name.
          awk -v f="${archive}" '$2 == f' checksums.txt | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks

      - name: Scan the history
        run: gitleaks git --no-banner --redact --exit-code 1 .

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install zizmor==1.30.1

      - name: Audit the workflows
        run: zizmor --min-severity medium .github/workflows
