name: Static analysis

# 'pull_request_target' is deliberate, not an oversight.
#
# It runs with a write token so the action can post its report as a PR comment,
# which a 'pull_request' run from a fork cannot do. Normally that pairing is
# dangerous, because pull_request_target checks out the BASE branch and any
# attempt to analyse the contributor's code means running untrusted code with a
# write token. esp-cpp/StaticAnalysis handles this itself: its entrypoint
# detects the pull_request_target event and clones the PR head into a separate
# 'pr_tree' directory, so the contributor's code is analysed but never executed.
#
# Two things keep that safe, so think hard before changing either:
#   - use_cmake stays false, so no CMake configure step runs on PR code.
#   - no init_script is set, since that would execute a script from the PR.
on: # zizmor: ignore[dangerous-triggers] -- see the explanation above
  # "**" not "*": GitHub branch globs treat "*" as matching any characters
  # EXCEPT "/", so a filter of "*" silently skips every pull request whose base
  # branch contains a slash (feat/..., chore/...). That is a silent skip rather
  # than a failure, which is the dangerous kind.
  pull_request_target:
    branches:
      - "**"

# The write token exists only so the action can post its report as a PR
# comment; nothing else here needs more than read access.
permissions:
  contents: read
  pull-requests: write

jobs:
  static_analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # the action clones the PR head with its own token

    - name: Run static analysis
      uses: esp-cpp/StaticAnalysis@36a11b0254834d560700eafd3d11f9f9b31bca7c # master on 2026-10-10
      with:
        # Do not build the project and do not use cmake to generate compile_commands.json
        use_cmake: false

        # (Optional) cppcheck args
        cppcheck_args: --check-level=exhaustive --force --enable=all --inline-suppr --inconclusive --platform=mips32 --std=c++17 --suppressions-list=$GITHUB_WORKSPACE/suppressions.txt
