name: Web tests

on: [pull_request]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run protocol tests
        run: node --test "tests/web/*.test.js"
