name: Web tests

on:
  pull_request:
  # Also on the default branch, so the README badge reflects it.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run protocol tests
        run: node --test "tests/web/*.test.js"
