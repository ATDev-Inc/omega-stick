# gitleaks configuration: the default rules, plus narrow allowlists for values
# that look like credentials but are published test vectors.

[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455 section 1.3 sample Sec-WebSocket-Key, used by the simulator's WebSocket tests"
regexTarget = "match"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
