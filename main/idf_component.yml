## IDF Component Manager Manifest File
#
# The espp components are pinned to the exact release this firmware is built
# and tested against (D20: one espp release across the board, 1.3.8 since
# 2026-10-18), and ESP-IDF to the release CI builds with
# (.github/workflows/build.yml). The component manager re-solves every
# dependency to the newest matching release whenever this file changes, and
# ignores dependencies.lock when it does, so a plain floor such as '>=1.3.5'
# would silently pull in whatever is newest the next time anything here is
# edited. (A re-solve once jumped espp 1.3.5 to 1.3.7, whose
# DispatcherModuleInfo had gained a field that this firmware's -Werror build
# rejected; that is how this comment got written.)
#
# To move to a newer espp: change every espp pin below together, since the
# components are released as a set, run `idf.py build`, run the host tests,
# and commit the regenerated dependencies.lock with the code changes.
dependencies:
  idf:
    version: '>=6.0'
  espp/task: '==1.3.8'
  espp/i2c: '==1.3.8'
  espp/joystick: '==1.3.8'
  espp/hid-rp: '==1.3.8'
  espp/math: '==1.3.8'
  espp/qtpy: '==1.3.8'
  espp/timer: '==1.3.8'
  espp/usb_device: '==1.3.8'
  espp/base_component: '==1.3.8'
  espressif/tinyusb: '==0.21.0~1'
  # Pulled in by espp/usb_device; pinned here so a re-solve cannot move it.
  espressif/esp_tinyusb: '==2.2.1'
  espp/base_peripheral: '==1.3.8'
  espp/file_system: '==1.3.8'
  espp/coredump: '==1.3.8'
  espp/dispatcher: '==1.3.8'
  espp/stream_frame: '==1.3.8'
  espp/ota: '==1.3.8'
  # Pulled in by the components above, not used directly. Pinned so a
  # re-solve cannot mix espp releases.
  espp/cli: '==1.3.8'
  espp/color: '==1.3.8'
  espp/format: '==1.3.8'
  espp/interrupt: '==1.3.8'
  espp/logger: '==1.3.8'
  espp/neopixel: '==1.3.8'
  espp/rmt: '==1.3.8'
